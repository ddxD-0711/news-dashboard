name: Update News Feed

on:
  schedule:
    # Läuft alle 6 Stunden (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Erlaubt es dir, den Job manuell über die GitHub-Oberfläche zu starten
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Skript ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Ergebnisse in GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-Update: news.json aktualisiert" || exit 0
          git push
