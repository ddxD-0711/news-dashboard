<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein KI News Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; }
    .card { background: #1e293b; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #38bdf8; }
    .source { font-size: 0.8rem; background: #334155; padding: 2px 8px; border-radius: 4px; color: #94a3b8; }
    .summary { font-size: 0.95rem; line-height: 1.5; color: #cbd5e1; white-space: pre-line; }
    a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Mein News Dashboard</h1>
  <div id="news-container">Lade Nachrichten...</div>

  <script>
    async function loadNews() {
      const container = document.getElementById("news-container");
      try {
        // Läuft über die von der GitHub Action generierte news.json
        const res = await fetch("./news.json?cache=" + Date.now());
        const items = await res.json();

        container.innerHTML = "";

        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span class="source">${item.source}</span>
            <h3>${item.title}</h3>
            <p class="summary">${item.summary}</p>
            <a href="${item.link}" target="_blank">Zum Original-Artikel →</a>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = "<p>Noch keine Nachrichten verfügbar. Starte die GitHub Action zuerst!</p>";
      }
    }

    loadNews();
  </script>
</body>
</html>
